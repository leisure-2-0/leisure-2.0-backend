name: leisure backend CI 통합 테스트 (dev branch push for merge)

on:
  push:
    branches:
      - dev

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true


permissions:
  contents: read

jobs:
  verify:
    name: 통합 테스트
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SPRING_PROFILES_ACTIVE: prod
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_NAME: test
      DB_USERNAME: test
      DB_PASSWORD: test
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6379
      RABBITMQ_HOST: 127.0.0.1
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: test
      RABBITMQ_PASSWORD: test
      ELASTICSEARCH_HOST: 127.0.0.1
      ELASTICSEARCH_PORT: 9200
      JWT_SECRET: Y2ktZHVtbXktand0LXNlY3JldC1ub3QtcmVhbC0zMmI=
      TOUR_API_SERVICE_KEY: dummy-service-key

    steps:
      - name: 코드 가져오기
        uses: actions/checkout@v4

      - name: JDK 21 설정
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Gradle 실행 권한 부여
        run: chmod +x gradlew

      - name: 테스트용 컨테이너 실행, 헬스체크
        run: docker compose -f ./docker/docker-compose-ci.yaml up -d --wait --wait-timeout 180

      - name: 통합 테스트 실행
        run: ./gradlew integrationTest --no-daemon

      - name: 테스트용 컨테이너 정리
        if: always()
        run: docker compose -f ./docker/docker-compose-ci.yaml down --volumes --remove-orphans

      - name: 짧은 SHA 추출
        id: vars
        run: echo "short_sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Buildx 설정
        uses: docker/setup-buildx-action@v3

      - name: 이미지 빌드 검증
        uses: docker/build-push-action@v6
        with:
          platforms: linux/amd64
          tags: leisure/backend:${{ steps.vars.outputs.short_sha }}
          context: .
          file: ./Dockerfile
          load: false
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max