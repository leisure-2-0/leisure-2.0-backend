name: leisure backend CD (main deploy)

on:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      short_sha: ${{ steps.vars.outputs.short_sha }}
    timeout-minutes: 25
    permissions:
      id-token: write
    steps:
      - name: 코드 가져오기
        uses: actions/checkout@v4

      - name: 짧은 SHA 추출
        id: vars
        run: echo "short_sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Buildx 설정
        uses: docker/setup-buildx-action@v3

      - name: 이미지 빌드
        uses: docker/build-push-action@v6
        with:
          platforms: linux/amd64
          tags: leisure/backend:${{ steps.vars.outputs.short_sha }}
          context: .
          file: ./Dockerfile
          load: true
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy 이미지 취약점 검사
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: leisure/backend:${{ steps.vars.outputs.short_sha }}
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

      - name: AWS 인증 (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ap-northeast-2
          role-to-assume: ${{ secrets.AWS_ECR_ROLE_ARN }} # ECR push용 IAM 역할 ARN

      - name: ECR 로그인
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: ECR로 이미지 push
        run: |
          ECR=${{ steps.ecr.outputs.registry }}/leisure/backend
          docker tag leisure/backend:${{ steps.vars.outputs.short_sha }} $ECR:${{ steps.vars.outputs.short_sha }}
          docker push $ECR:${{ steps.vars.outputs.short_sha }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      id-token: write

    steps:
      - name: 코드 가져오기
        uses: actions/checkout@v4

      - name: AWS 인증 (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ap-northeast-2
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }} # SSM 배포용 IAM 역할 ARN

      - name: EC2 조회
        id: instance
        run: |
          EC2_INSTANCE_ID=$(aws ec2 describe-instances \
            --filters \
              "Name=tag:Role,Values=backend" \
              "Name=tag:Environment,Values=prod" \
              "Name=instance-state-name,Values=running" \
            --query "Reservations[].Instances[].InstanceId" \
            --output text)

          if [ -z "$EC2_INSTANCE_ID" ]; then
            echo "인스턴스를 찾지 못했습니다."
            exit 1
          fi

          echo "EC2_INSTANCE_ID=$EC2_INSTANCE_ID" >> "$GITHUB_OUTPUT"

      - name: EC2 배포 (SSM 사용)
        run: |
          EC2_INSTANCE_ID="${{ steps.instance.outputs.EC2_INSTANCE_ID }}"
          DEPLOY_SH_B64=$(base64 -w 0 deploy.sh)
          DOCKER_COMPOSE_B64=$(base64 -w 0 ./docker/docker-compose.yaml)

          jq -n \
            --arg deploy "$DEPLOY_SH_B64" \
            --arg docker_compose "$DOCKER_COMPOSE_B64" \
            --arg tag "${{ needs.build-and-push.outputs.short_sha }}" \
            '{
              commands: [
                  "set -e",
                  "mkdir -p /home/ubuntu/leisure",
                  "cd /home/ubuntu/leisure",
                  ("printf %s " + ($deploy | @sh) + " | base64 -d > deploy.sh"),
                  ("printf %s " + ($docker_compose | @sh) + " | base64 -d > docker-compose.yaml"),
                  "chmod +x deploy.sh",
                  ("./deploy.sh " + ($tag | @sh))
                ]
              }' > ssm-parameters.json

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters file://ssm-parameters.json \
            --query "Command.CommandId" --output text)

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "$EC2_INSTANCE_ID" || {
              echo "배포 실패"
              echo "===== SSM STDOUT ====="
              aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "$EC2_INSTANCE_ID" \
                --query "StandardOutputContent" --output text
              echo "===== SSM STDERR ====="
              aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "$EC2_INSTANCE_ID" \
                --query "StandardErrorContent" --output text
              exit 1
            }
