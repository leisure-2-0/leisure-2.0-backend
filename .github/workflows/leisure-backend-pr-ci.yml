on:
pull_request:
branches:
  - dev
  - main

jobs:
build:
name: 빌드 및 테스트
runs-on: ubuntu-latest

steps:
  - name: 코드 가져오기
    uses: actions/checkout@v6

  - name: JDK 21 설정
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '21'
      cache: gradle

  - name: Gradle 실행 권한 부여
    run: chmod +x gradlew

  - name: 빌드 및 테스트
    run: ./gradlew build