name: leisure

x-leisure-service-defaults: &leisure-service-defaults
  image:
  restart: unless-stopped
  env_file:
    - ${APP_ENV_FILE:-.env}
  environment:
    SPRING_PROFILES_ACTIVE: prod
    SERVER_PORT: 8080
  expose:
    - "8080"
  extra_hosts:
    - "host.docker.internal:host-gateway"
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  read_only: true
  tmpfs:
    - /tmp
  healthcheck:
    test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/8080'"]
    interval: 30s
    timeout: 5s
    retries: 3
    start_period: 40s
  networks:
    - app_net

services:
  leisure_blue:
    <<: *leisure-service-defaults

  leisure_green:
    <<: *leisure-service-defaults

  portainer:
    image: portainer/portainer-ce:2.39.4
    restart: always
    volumes:
      - portainer_data:/data
      - /var/lib/docker/volumes:/var/lib/docker/volumes
    networks:
      - management_net

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./.deploy/nginx/app-upstream.inc:/etc/nginx/conf.d/app-upstream.inc:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot
    depends_on:
      portainer:
        condition: service_started
    networks:
      - app_net
      - management_net

networks:
  app_net:
    driver: bridge
  management_net:
    driver: bridge

volumes:
  portainer_data:
    external: true
