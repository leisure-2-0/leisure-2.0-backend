# application-prod.yml
# 운영 환경 전용 설정 파일

spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: 0
#      connect-timeout:
#      timeout:
#      lettuce:
#        pool:
#          max-active:
#          max-idle:
#          min-idle:

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME}
    password: ${RABBITMQ_PASSWORD}
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
    listener:
      simple:
        acknowledge-mode: manual
        prefetch: 10
        default-requeue-rejected: false
        retry:
          enabled: false

  elasticsearch:
    uris: http://${ELASTICSEARCH_HOST:localhost}:${ELASTICSEARCH_PORT:9200}
    username: ${ELASTICSEARCH_USERNAME:}
    password: ${ELASTICSEARCH_PASSWORD:}

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        highlight_sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

decorator:
  datasource:
    p6spy:
      enable-logging: false

jwt:
  secret: ${JWT_SECRET}
  access-token-expiration: 3600000 # 1 hour
  refresh-token-expiration: 1209600000 # 14 days

cookie:
  refresh-token:
    name: refreshToken
    path: /
    secure: true
    same-site: Lax
    max-age: 1209600

springdoc:
  enable-data-rest: false
  default-consumes-media-type: application/json
  default-produces-media-type: application/json
  swagger-ui:
    enabled: false
  api-docs:
    enabled: false

swagger:
  title: 프로젝트 Y prod API
  description: 프로젝트 Y 운영용 문서
  version: 1.0.0-prod

tour-api:
  base-url: ${TOUR_API_BASE_URL:https://apis.data.go.kr/B551011/KorService2}
  service-key: ${TOUR_API_SERVICE_KEY}
  max-attempts: 3
  retry-initial-delay-ms: 1000
  retry-max-delay-ms: 10000
  retry-backoff-multiplier: 2.0

search:
  enabled: true
  sync:
    fixed-delay-ms: 300000
    batch-size: 500
  initial-index:
    enabled: false
  boost:
    title: 4.0
    tags: 3.0
    category: 2.0
    region: 1.0
  fuzziness: auto
  fuzz:
    max-expansions: 25
    prefix-length: 0