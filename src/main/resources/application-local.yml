# application-local.yml
# 로컬 개발 환경 전용 설정 파일 (로컬 PC에서 실행할 때 사용)

spring:
  config:
    import: optional:file:.env[.properties]

  datasource:
    # DB 접속 주소
    #   jdbc:mysql://호스트:포트/DB이름?옵션들
    #   - localhost:3306    → 내 컴퓨터의 MySQL, 기본 포트 3306
    #   - leisure           → 사용할 데이터베이스(스키마) 이름
    #   - useSSL=false                    → SSL 암호화 연결 안 함 (로컬이라 불필요)
    #   - allowPublicKeyRetrieval=true    → MySQL 8 비밀번호 인증 시 공개키 가져오기 허용
    #   - serverTimezone=Asia/Seoul       → 서버 시간대를 한국 시간으로 설정
    #   - characterEncoding=UTF-8         → 한글 등 문자 깨짐 방지
    url: jdbc:mysql://localhost:3306/leisure-local?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: root                        # DB 계정 이름
    password: root                        # DB 계정 비밀번호
    driver-class-name: com.mysql.cj.jdbc.Driver  # MySQL 용 JDBC 드라이버

  data:
    redis:
      host: localhost
      port: 6379
      database: 0

  rabbitmq:
    host: localhost
    port: 5672
    username: leisure
    password: leisure

    # 발행 확인(publisher confirm): 브로커가 메시지를 받았는지 비동기 ack. correlated=어떤 메시지가 확인됐는지 상관관계 데이터로 추적 가능
    publisher-confirm-type: correlated
    # 발행 반환(publisher return): 큐로 라우팅되지 못한 메시지를 다시 돌려받음(바인딩 오류 등 감지)
    publisher-returns: true
    template:
      # 라우팅 실패 메시지를 버리지 않고 return 콜백으로 돌려보냄(publisher-returns가 실제로 동작하려면 필요)
      mandatory: true
    listener:
      simple:
        # ack 방식: auto=리스너 정상 종료 시 자동 ack, 예외 던지면 자동 nack
        acknowledge-mode: manual
        # 컨슈머가 한 번에 미리 가져오는 미확인 메시지 수(처리량 조절). 공식 = 왕복시간 / 처리시간
        prefetch: 10
        # nack된 메시지를 큐로 되돌릴지: false=되돌리지 않고 DLQ로 보냄(무한 재전송 루프 방지, 영구실패 격리)
        default-requeue-rejected: false
        retry:
          # 인메모리 재시도: false=재시도 없이 실패 즉시 DLQ.
          # 참고) 이 컨슈머는 MANUAL ack로 예외를 직접 catch해 basicNack(→DLQ) 하는 구조라,
          #       선언적 재시도(true)를 켜도 인터셉터가 예외를 못 받아 동작하지 않는다(의도적으로 off).
          #       재시도가 필요하면 AUTO ack + 예외 전파 방식으로 바꿔야 한다. earn은 멱등이라 재시도 자체는 안전.
          enabled: false

  jpa:
    hibernate:
      # DDL(테이블 생성/수정) 자동화 전략
      #   - none        : 아무것도 안 함
      #   - validate    : 엔티티와 테이블이 맞는지 검증만
      #   - update      : 변경된 부분만 반영 (데이터 유지)
      #   - create      : 실행할 때마다 테이블 새로 생성 (기존 데이터 삭제)
      #   - create-drop : create + 앱 종료 시 테이블 삭제
      ddl-auto: validate
    show-sql: false       # 실행되는 SQL 쿼리를 콘솔에 출력

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

jwt:
  secret: 'rDWUWrSEvHJy9scyrKlQykuBLeASH2a6ZfFegS2GkiA=' # No meaning value, base64, 256bit
  access-token-expiration: 3600000 # 1 hour
  refresh-token-expiration: 1209600000 # 14 days

cookie:
  refresh-token:
    name: refreshToken
    path: /
    secure: false
    same-site: Lax
    max-age: 1209600 # 14 days

#logging:
#  level:
#    org.hibernate.SQL: debug
#    org.hibernate.orm.jdbc.bind: trace

springdoc:
  enable-data-rest: false
  swagger-ui:
    enabled: true
  api-docs:
    enabled: true

swagger:
  title: 프로젝트 Y Local API
  description: 프로젝트 Y 로컬 테스트용 문서
  version: 1.0.0-local

decorator:
  datasource:
    p6spy:
      enable-logging: true
      logging: slf4j
      multiline: true
      log-format: "%(currentTime) | took %(executionTime)ms | %(category) | connection %(connectionId) | %(sqlSingleLine)"

tour-api:
  base-url: https://apis.data.go.kr/B551011/KorService2
  service-key: ${TOUR_API_SERVICE_KEY}   # .env의 TOUR_API_SERVICE_KEY
  max-attempts: 3
  retry-initial-delay-ms: 1000
  retry-max-delay-ms: 10000
  retry-backoff-multiplier: 2.0